name: Expand PourSociety source package

on:
  push:
    paths:
      - 'poursociety-source.chunk07'

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and extract source package
        run: |
          cat poursociety-source.chunk* | base64 --decode > /tmp/poursociety-platform.tar.gz
          mkdir -p /tmp/poursociety-src
          tar -xzf /tmp/poursociety-platform.tar.gz -C /tmp/poursociety-src
          rsync -a --exclude='.git/' /tmp/poursociety-src/poursociety-platform/ ./
          rm -f poursociety-source.chunk*
          rm -f poursociety-platform.zip.part*
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add complete PourSociety application source"
          git push
